<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة — سفراء NextStep AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--navy:#0D1B3D;--blue:#146EF5;--cyan:#35D6F5;--ice:#f1f7fe;--ln:#dbe6f5;--mut:#5b6a86}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Cairo,sans-serif;background:var(--ice);color:var(--navy)}
button,input,select,textarea{font:14px Cairo}
.b{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer}.b.o{background:#fff;color:var(--navy);border:1px solid var(--ln)}.b.r{background:#e11d48}
input,select,textarea{border:1px solid var(--ln);border-radius:8px;padding:7px 10px;background:#fff;color:var(--navy);max-width:100%}
.logo{display:flex;align-items:center;gap:8px;direction:ltr;font:800 20px Montserrat}.logo img{height:34px}.logo i{font-style:normal;color:var(--cyan)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center}#login .bx{background:#fff;border-radius:20px;padding:34px;width:340px;text-align:center;box-shadow:0 10px 40px #146ef522;display:grid;gap:14px;justify-items:center}#login input{width:100%;padding:11px}#err{color:#e11d48;font-size:13px;min-height:18px}
.top{background:#fff;border-bottom:1px solid var(--ln);padding:10px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.tabs{display:flex;gap:6px;margin-right:auto}.tabs button{background:none;border:0;padding:8px 16px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--mut)}.tabs .on{background:var(--ice);color:var(--blue)}
main{padding:20px 22px;max-width:1300px;margin:auto}.st{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.st div{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 16px;color:var(--mut);font-size:13px}.st b{display:block;font:800 26px Montserrat;color:var(--navy)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tw{background:#fff;border:1px solid var(--ln);border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}th{background:#f7fbff;color:var(--mut)}tr:hover td{background:#fafcff}
dialog{border:0;border-radius:18px;padding:22px;width:min(640px,94vw);box-shadow:0 20px 60px #0006}dialog::backdrop{background:#0d1b3d88}dialog dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px;margin:12px 0}dt{color:var(--mut)}dd{white-space:pre-wrap}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}.ci{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px;display:grid;gap:8px}.pv{display:flex;gap:10px;justify-content:center;direction:ltr}.ci input{width:100%}.ci .rw{display:flex;gap:6px}
/* ===== البطاقة ===== */
.card{position:relative;width:var(--w);height:calc(var(--w)*1.585);font-size:calc(var(--w)/22);background:linear-gradient(165deg,#fff 45%,#e9f3ff);border-radius:1.4em;overflow:hidden;box-shadow:0 .3em 1.2em #0d1b3d22;direction:rtl;text-align:center;color:#0D1B3D;flex:none;font-family:Cairo,sans-serif}
.card.flat{border-radius:0;box-shadow:none}.dc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lg{position:absolute;top:1.5em;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:.5em;direction:ltr}.lg img{height:2.7em;width:auto}.lg b{font:800 1.45em/1 Montserrat;display:block;text-align:left}.lg i{font-style:normal;color:#17b8e8}.lg small{font:500 .5em Montserrat;color:#5b6a86;display:block;text-align:left;white-space:nowrap;margin-top:.2em}
.ph{position:absolute;top:6.8em;left:5.5em;width:11em;height:11em;border:.12em solid #35D6F5;border-radius:1em;object-fit:cover;background:#e3eefb;display:flex;align-items:center;justify-content:center;font-size:3em;box-sizing:border-box}
.nm{position:absolute;top:19em;left:.8em;right:.8em;font-weight:800;line-height:1.25}.rl{position:absolute;top:23em;left:0;right:0;font-size:.95em;font-weight:600;color:#146EF5}
.hr{position:absolute;top:25em;left:8.5em;right:8.5em;height:.1em;background:linear-gradient(90deg,transparent,#35D6F5,transparent)}
.un{position:absolute;top:26.3em;left:2.4em;right:2.4em;background:#e3f1ff;border-radius:999px;padding:.3em .8em;font-size:.95em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{position:absolute;bottom:2em;left:1.6em;font-size:.9em;font-weight:600;color:#146EF5;text-align:right;line-height:1.5}
.bt{position:absolute;top:7.4em;left:1.5em;right:1.5em;display:flex;align-items:center;gap:.6em}.bt:before,.bt:after{content:"";flex:1;height:.1em;background:#35D6F5}.bt b{font-size:2em;font-weight:800}
.bs{position:absolute;top:11em;left:0;right:0;font-weight:700;font-size:1.05em}
.bq{position:absolute;top:13.6em;left:2.4em;right:2.4em;font-size:.95em;line-height:1.7;font-weight:600}.bq:before{content:"❝";color:#35D6F5;font-size:1.6em;position:absolute;right:-1.4em;top:-.3em}
.ic{position:absolute;top:19.2em;left:1em;right:1em;display:flex;justify-content:space-around}.ic div{font-size:.62em;font-weight:600;line-height:1.4;color:#2b4a7a}.ic span{display:block;font-size:2.2em}
.qr{position:absolute;top:25.2em;left:1.6em;right:1.6em;height:5.6em;border:.1em solid #35D6F5;border-radius:1em;display:flex;align-items:center;gap:.8em;padding:.5em;background:#fff;box-sizing:border-box}.qr svg{width:4.4em;height:4.4em;flex:none}.qr p{font-size:.66em;font-weight:600;text-align:right;line-height:1.5}
.lk{position:absolute;top:31.6em;left:0;right:0;font:600 .62em Montserrat;color:#146EF5;direction:ltr}
.ed{position:absolute;bottom:1.1em;left:1.6em;font:700 .66em Montserrat;color:#146EF5;letter-spacing:.12em}
#pa{display:none}@media print{body>*:not(#pa){display:none!important}#pa{display:block!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.pg{page-break-after:always;overflow:hidden}.pg:last-child,.sh:last-child{page-break-after:auto}.sh{page-break-after:always;display:grid;grid-template-columns:repeat(3,54mm);gap:4mm;justify-content:center;direction:ltr}.sh.bk{direction:rtl}.sh .card{border:.2mm dashed #9aa;border-radius:2mm;box-shadow:none}}
@media(max-width:800px){.st{grid-template-columns:1fr 1fr}}
</style></head><body>

const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
const ST={new:'جديد',review:'قيد الفرز',interview:'مدعو للمقابلة',accepted:'مقبول',rejected:'مرفوض'},LB={full_name:'الاسم',gender:'الجنس',birth_year:'سنة الميلاد',phone:'الجوال',email:'البريد',city:'المدينة',university:'الجامعة',major:'التخصص',study_level:'المستوى',gpa:'المعدل',social_link:'الرابط',skills:'المهارات',weekly_hours:'الوقت الأسبوعي',experience:'الخبرات',motivation:'سبب الرغبة',ideas:'أفكاره',created_at:'تاريخ التسجيل'};
let rows=[],cards=[];
Object.entries(ST).forEach(([k,v])=>$('#fs').insertAdjacentHTML('beforeend',`<option value="${k}">${v}</option>`));
$('#go').onclick=async()=>{if(C.SUPABASE_ANON_KEY.startsWith('PASTE'))return $('#err').textContent='لم يتم ضبط مفتاح Supabase (README)';const {error}=await sb.auth.signInWithPassword({email:C.ADMIN_EMAIL,password:$('#pw').value});if(error)return $('#err').textContent='كلمة المرور غير صحيحة';enter()};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
if(!C.SUPABASE_ANON_KEY.startsWith('PASTE'))sb.auth.getSession().then(({data})=>{if(data.session)enter()});
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));['t1','t2'].forEach(t=>$('#'+t).hidden=t!==b.dataset.t)});
async function enter(){$('#login').hidden=true;$('#app').hidden=false;load()}
async function load(){const {data,error}=await sb.from('ambassador_applications').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);rows=data;const us=[...new Set(rows.map(r=>r.university))].sort();$('#fu').innerHTML='<option value="">كل الجامعات</option>'+us.map(u=>`<option>${esc(u)}</option>`).join('');draw()}
const fv=()=>{const q=$('#q').value.trim().toLowerCase();return rows.filter(r=>(!q||(r.full_name+r.email+r.phone).toLowerCase().includes(q))&&(!$('#fs').value||r.status===$('#fs').value)&&(!$('#fu').value||r.university===$('#fu').value)&&(!$('#fg').value||r.gender===$('#fg').value))};
function draw(){const v=fv();$('#s1').textContent=rows.length;$('#s2').textContent=rows.filter(r=>r.gender==='male').length;$('#s3').textContent=rows.filter(r=>r.gender==='female').length;$('#s4').textContent=rows.filter(r=>r.status==='accepted').length;
$('#tb').innerHTML=v.map(r=>`<tr><td><b>${esc(r.full_name)}</b></td><td>${r.gender==='male'?'ذكر':'أنثى'}</td><td>${esc(r.university)}</td><td>${esc(r.major)}</td><td>${esc(r.study_level)}</td><td dir="ltr">${esc(r.phone)}</td><td>${new Date(r.created_at).toLocaleDateString('ar-EG')}</td><td><select data-s="${r.id}">${Object.entries(ST).map(([k,t])=>`<option value="${k}"${k===r.status?' selected':''}>${t}</option>`).join('')}</select></td><td><button class="b o" data-v="${r.id}">عرض</button></td></tr>`).join('')||'<tr><td colspan="9" style="text-align:center;color:#5b6a86">لا توجد طلبات</td></tr>'}
['q','fs','fu','fg'].forEach(i=>$('#'+i).oninput=draw);$('#rf').onclick=load;
$('#tb').onchange=async e=>{const id=e.target.dataset.s;if(!id)return;const {error}=await sb.from('ambassador_applications').update({status:e.target.value}).eq('id',id);if(error)return alert(error.message);rows.find(r=>r.id===id).status=e.target.value;draw()};
let cur=null;$('#tb').onclick=async e=>{const id=e.target.dataset.v;if(!id)return;cur=rows.find(r=>r.id===id);let img='';if(cur.photo_path){const {data}=await sb.storage.from(B).createSignedUrl(cur.photo_path,3600);if(data)img=`<img src="${data.signedUrl}" style="width:110px;height:110px;border-radius:14px;object-fit:cover;border:2px solid #35D6F5">`}
$('#dc').innerHTML=`<div style="display:flex;gap:14px;align-items:center">${img}<h3>${esc(cur.full_name)}</h3></div><dl>${Object.keys(LB).map(k=>`<dt>${LB[k]}</dt><dd>${esc(Array.isArray(cur[k])?cur[k].join('، '):k==='gender'?(cur[k]==='male'?'ذكر':'أنثى'):cur[k]||'—')}</dd>`).join('')}</dl><textarea id="nt" style="width:100%;min-height:70px" placeholder="ملاحظة الإدارة">${esc(cur.admin_note||'')}</textarea>`;$('#dl').showModal()};
$('#sv').onclick=async()=>{const {error}=await sb.from('ambassador_applications').update({admin_note:$('#nt').value}).eq('id',cur.id);if(error)return alert(error.message);cur.admin_note=$('#nt').value;$('#dl').close()};
$('#ex').onclick=()=>{const k=Object.keys(LB),h=[...k.map(x=>LB[x]),'الحالة','ملاحظة'],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',l=fv().map(r=>[...k.map(x=>q(Array.isArray(r[x])?r[x].join('، '):x==='gender'?(r[x]==='male'?'ذكر':'أنثى'):r[x])),q(ST[r.status]),q(r.admin_note)].join(','));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+h.join(',')+'\n'+l.join('\n')],{type:'text/csv'}));a.download='ambassadors.csv';a.click()};
/* ===== البطاقات ===== */
const QR=(()=>{const q=qrcode(0,'M');q.addData(C.LINKEDIN_URL);q.make();const n=q.getModuleCount();let p='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`M${c} ${r}h1v1h-1z`;return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${p}" fill="#0D1B3D"/></svg>`})();
const DECO=`<svg class="dc" viewBox="0 0 220 349" preserveAspectRatio="none"><defs><linearGradient id="g1" x1="0" x2="1" y1="1" y2="0"><stop offset="0" stop-color="#d9efff"/><stop offset="1" stop-color="#8fd3f4"/></linearGradient></defs><path d="M0 310 C70 280 130 305 220 245 L220 349 L0 349Z" fill="url(#g1)" opacity=".55"/><path d="M150 335 L208 262 M208 262 L192 264 M208 262 L206 278" stroke="#27a8f2" stroke-width="3" fill="none" stroke-linecap="round" opacity=".75"/><g fill="#2b8cf5" opacity=".8"><path d="M118 332l14-3 0 6-14 3z"/><path d="M134 326l14-3 0 6-14 3z"/><path d="M150 320l14-3 0 6-14 3z"/></g></svg>`;
const LG=`<div class="lg"><img src="${MARK}"><div><b>NextStep <i>AI</i></b><small>Your Next Step. Smarter with AI.</small></div></div>`;
const front=(c,w,f)=>{const L=c.name.length,fs=L>30?1.2:L>24?1.4:L>18?1.6:1.85,uf=c.uni.length>28?.8:.95;return `<div class="card${f?' flat':''}" style="--w:${w}">${DECO}${LG}${c.photo?`<img class="ph" src="${c.photo}">`:'<div class="ph">👤</div>'}<div class="nm" style="font-size:${fs}em">${esc(c.name)}</div><div class="rl">سفير منصة NextStep AI</div><div class="hr"></div><div class="un" style="font-size:${uf}em">🎓 ${esc(c.uni)}</div><div class="tg">معاً .. نبني جيل<br>يصنع الفرق</div></div>`};
const back=(w,f)=>`<div class="card${f?' flat':''}" style="--w:${w}">${DECO}${LG}<div class="bt"><b>بطاقة سفير</b></div><div class="bs">${C.BADGE_SUB}</div><div class="bq">معاً لتمكين الطلاب والجامعة وإحداث أثر حقيقي في مجتمعنا</div><div class="ic"><div><span>👥</span>قيادة<br>بالمعرفة</div><div><span>💡</span>إرشاد<br>بالخبرة</div><div><span>🎯</span>توجيه<br>بالمصداقية</div><div><span>📈</span>صناعة أثر<br>معاً</div></div><div class="qr">${QR}<p>تابع منصة NextStep AI على LinkedIn وكن جزءاً من رحلتنا</p></div><div class="lk">${C.LINKEDIN_TEXT}</div><div class="ed">${C.EDITION}</div></div>`;
function grid(){$('#cn').hidden=cards.length>0;$('#gr').innerHTML=cards.map((c,i)=>`<div class="ci" data-i="${i}"><div class="pv">${front(c,'150px')}${back('150px')}</div><input data-k="name" value="${esc(c.name)}" placeholder="الاسم"><input data-k="uni" value="${esc(c.uni)}" placeholder="الجامعة"><div class="rw"><label class="b o" style="flex:1;text-align:center">📷 صورة<input type="file" accept="image/*" data-p hidden></label><button class="b r" data-d>حذف</button></div></div>`).join('')}
function prev(i){const it=$(`.ci[data-i="${i}"] .pv`);it.innerHTML=front(cards[i],'150px')+back('150px')}
$('#gr').oninput=e=>{const it=e.target.closest('.ci');if(!it||!e.target.dataset.k)return;const i=+it.dataset.i;cards[i][e.target.dataset.k]=e.target.value;prev(i)};
$('#gr').onchange=e=>{const it=e.target.closest('.ci');if(e.target.dataset.p!==undefined){const i=+it.dataset.i;cards[i].photo=URL.createObjectURL(e.target.files[0]);prev(i)}};
$('#gr').onclick=e=>{if(e.target.dataset.d!==undefined){cards.splice(+e.target.closest('.ci').dataset.i,1);grid()}};
$('#add').onclick=()=>{cards.push({name:'اسم السفير',uni:'اسم الجامعة',photo:''});grid()};
$('#bDb').onclick=async()=>{const acc=rows.filter(r=>r.status==='accepted');if(!acc.length)return alert('لا يوجد مقبولون بعد. غيّر حالة المقبولين إلى «مقبول» من تبويب الطلبات.');const ps=acc.filter(r=>r.photo_path).map(r=>r.photo_path),m={};if(ps.length){const {data}=await sb.storage.from(B).createSignedUrls(ps,7200);(data||[]).forEach(d=>m[d.path]=d.signedUrl)}cards=acc.map(r=>({name:r.full_name,uni:r.university,photo:m[r.photo_path]||''}));grid()};
$('#xl').onchange=async e=>{const f=e.target.files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),rs=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).filter(r=>r.some(x=>String(x).trim()));const h=rs[0].map(String);let ni=h.findIndex(x=>/name|الاسم|اسم/i.test(x)),ui=h.findIndex(x=>/uni|جامع/i.test(x)),st=1;if(ni<0&&ui<0){ni=0;ui=1;st=0}if(ni<0)ni=0;if(ui<0)ui=ni===0?1:0;rs.slice(st).forEach(r=>{const n=String(r[ni]).replace(/\s+/g,' ').trim();if(n)cards.push({name:n,uni:String(r[ui]||'').trim(),photo:''})});grid();e.target.value=''};
$('#pr').onclick=()=>{if(!cards.length)return alert('لا توجد بطاقات');const sh=$('#lay').value==='sheet',W=sh?54:+$('#sz').value,H=+(W*1.585).toFixed(1),w=W+'mm';let h='';
if(!sh)cards.forEach(c=>{h+=`<div class="pg" style="width:${w};height:${H}mm">${front(c,w,1)}</div><div class="pg" style="width:${w};height:${H}mm">${back(w,1)}</div>`});
else{for(let i=0;i<cards.length;i+=9)h+=`<div class="sh">${cards.slice(i,i+9).map(c=>front(c,w)).join('')}</div>`;for(let i=0;i<cards.length;i+=9)h+=`<div class="sh bk">${cards.slice(i,i+9).map(()=>back(w)).join('')}</div>`}
$('#pa').innerHTML=h;$('#pgs').textContent=`@page{size:${sh?'A4':W+'mm '+H+'mm'};margin:${sh?'10mm':0}}`;setTimeout(()=>window.print(),500)};
</script></body></html>
